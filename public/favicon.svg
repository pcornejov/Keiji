<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Cresta de gallo estilizada, icono de la enciclopedia de Keiji">
  <title>Keiji — cresta de gallo</title>
  <!--
    Favicon original (sin copyright), diseñado para la enciclopedia de Keiji.
    3 formas, colores tomados literalmente de src/styles/tokens.css:
      1) fondo circular  -> --color-papel-claro (#fdfaf2)
      2) cresta (comb)   -> --color-cresta       (#c8321e)
      3) barbilla (drop) -> --color-cresta-oscuro (#9c2312)
    Legible a 16x16 y 32x32: formas grandes, sin detalle fino.
  -->
  <circle cx="16" cy="16" r="15" fill="#fdfaf2" />
  <path
    d="M9,20
       C9,14 10,9 12,8
       C13,7.5 13.5,10 14,13
       C14.5,16 15,9 16,5
       C17,9 17.5,16 18,13
       C18.5,10 19,7.5 20,8
       C22,9 23,14 23,20
       C22,24 10,24 9,20
       Z"
    fill="#c8321e"
  />
  <path
    d="M16,23
       C18,23 19,26 16,29
       C13,26 14,23 16,23
       Z"
    fill="#9c2312"
  />
</svg>
